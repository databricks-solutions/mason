# DABs bundle for mason-sync — manages the Databricks App only.
#
# The Lakebase infrastructure (project/branch/endpoint/database) is
# provisioned once, out-of-band, and referenced here by resource path. The
# Beta postgres terraform resources are not idempotent enough yet to manage
# the full stack in one bundle (endpoint/database creation races); revisit
# when they stabilize. One-time provisioning:
#
#   databricks postgres create-project --json '{
#     "project": {"project_id": "mason-sync", "pg_version": 17,
#       "display_name": "Mason session sync",
#       "default_endpoint_settings": {"autoscaling_limit_min_cu": 0.5,
#         "autoscaling_limit_max_cu": 2, "suspend_timeout_duration": "300s"}}}'
#
# A new project auto-creates the default branch ("production"), a read-write
# endpoint ("primary"), and the "databricks_postgres" database.

bundle:
  name: mason-sync

variables:
  lakebase_branch:
    description: Lakebase branch resource path
    default: projects/mason-sync/branches/production
  lakebase_endpoint:
    description: Lakebase endpoint resource path (ENDPOINT_NAME for the app)
    default: projects/mason-sync/branches/production/endpoints/primary
  pg_database:
    description: >
      Control-plane database id for the app binding. Note: the id uses a
      hyphen (databricks-postgres) while the actual Postgres database name
      uses an underscore (databricks_postgres) — the binding injects the
      correct PGDATABASE at runtime.
    default: databricks-postgres

# build/ and public/viewer.js are gitignored (compiled output) but the app
# runtime needs them — include explicitly. node_modules stays excluded; the
# Apps runtime installs from package.json.
sync:
  include:
    - build/**
    - public/viewer.js
  exclude:
    # The bundle root has no .gitignore of its own (the repo-root one doesn't
    # apply to bundle sync), so exclude explicitly — a macOS-built
    # node_modules breaks the Linux app's package install.
    - node_modules/**
    # Lockfiles generated on dev laptops pin tarball URLs from the corporate
    # npm proxy, which 404 inside the Apps build environment. Without a
    # lockfile the app build resolves fresh against its own registry.
    # TODO(prod hardening): generate a lockfile inside the Apps environment
    # (or CI) and ship that instead.
    - package-lock.json

targets:
  dev:
    mode: development
    default: true

resources:
  apps:
    mason_sync:
      name: mason-sync
      description: "Session-sync server for Mason — mobile live viewer"
      source_code_path: .
      resources:
        - name: mason-sync-db
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_branch}/databases/${var.pg_database}
            permission: CAN_CONNECT_AND_CREATE
      config:
        env:
          - name: ENDPOINT_NAME
            value: ${var.lakebase_endpoint}
